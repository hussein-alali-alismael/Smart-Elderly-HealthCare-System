<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>نظام رعاية المسنين - الرئيسية</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="wrapper">
    <!-- Sidebar -->
    <nav id="sidebar">
        <div class="sidebar-header">
            <h3>رعاية المسنين</h3>
        </div>
        <ul class="list-unstyled components">
            <li class="active"><a href="index.html"><i class="fas fa-users"></i> إدارة المرضى</a></li>
            <li><a href="medications.html"><i class="fas fa-pills"></i> الأدوية</a></li>
            <li><a href="notifications.html"><i class="fas fa-bell"></i> الإشعارات <span class="notif-badge">0</span></a></li>
            <li><a href="live.html"><i class="fas fa-video"></i> المراقبة المباشرة</a></li>
        </ul>
    </nav>

    <!-- Page Content -->
    <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm rounded-4 mb-4 p-3">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-primary">
                    <i class="fas fa-align-right"></i>
                </button>
                <h4 class="ms-auto mb-0 fw-bold">لوحة التحكم</h4>
            </div>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">قائمة المرضى</h2>
            <button class="btn btn-primary shadow" data-bs-toggle="modal" data-bs-target="#addPatientModal">
                <i class="fas fa-plus-circle me-2"></i> إضافة مريض جديد
            </button>
        </div>

        <div class="row" id="patientsList">
            <!-- Rendered by JS -->
        </div>
    </div>
</div>

<!-- Add Patient Modal -->
<div class="modal fade" id="addPatientModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-0 p-4">
                <h5 class="modal-title fw-bold">إضافة مريض جديد</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="addPatientForm">
                <div class="modal-body p-4 pt-0">
                    <div class="mb-3">
                        <label class="form-label fw-bold">اسم المريض</label>
                        <input type="text" id="pName" class="form-control" placeholder="أدخل الاسم الكامل" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label fw-bold">العمر</label>
                            <input type="number" id="pAge" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold">الحالة</label>
                            <select id="pStatus" class="form-select form-control">
                                <option value="مستقر">مستقر</option>
                                <option value="تحت المراقبة">تحت المراقبة</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">الأمراض المزمنة</label>
                        <textarea id="pDiseases" class="form-control" rows="3" placeholder="مثال: السكري، ضغط الدم..."></textarea>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4">
                    <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">إلغاء</button>
                    <button type="submit" class="btn btn-primary px-4">حفظ البيانات</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
