<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام رعاية المسنين - الأدوية</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="wrapper">
    <nav id="sidebar">
        <div class="sidebar-header">
            <h3>رعاية المسنين</h3>
        </div>
        <ul class="list-unstyled components">
            <li><a href="index.html"><i class="fas fa-users"></i> إدارة المرضى</a></li>
            <li class="active"><a href="medications.html"><i class="fas fa-pills"></i> الأدوية</a></li>
            <li><a href="notifications.html"><i class="fas fa-bell"></i> الإشعارات <span class="notif-badge">0</span></a></li>
            <li><a href="live.html"><i class="fas fa-video"></i> المراقبة المباشرة</a></li>
        </ul>
    </nav>

    <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm rounded-4 mb-4 p-3">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-primary">
                    <i class="fas fa-align-right"></i>
                </button>
                <h4 class="ms-auto mb-0 fw-bold">إدارة الأدوية</h4>
            </div>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">قائمة الأدوية</h2>
            <button class="btn btn-primary shadow" data-bs-toggle="modal" data-bs-target="#addMedModal">
                <i class="fas fa-plus-circle me-2"></i> إضافة دواء
            </button>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="p-3">المرجع</th>
                                <th class="p-3">الدواء</th>
                                <th class="p-3">الجرعة</th>
                                <th class="p-3">الوقت</th>
                                <th class="p-3">إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="medsTableBody">
                            <!-- Rendered by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Med Modal -->
<div class="modal fade" id="addMedModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-0 p-4">
                        <h5 class="modal-title fw-bold">إضافة دواء جديد إلى سجل الأدوية</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="addMedForm">
                <div class="modal-body p-4 pt-0">
                    <div class="mb-3">
                        <label class="form-label fw-bold">المريض (اختياري، للعرض فقط)</label>
                        <select id="medPatientId" class="form-select form-control" required>
                            <!-- Loaded by JS -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">اسم الدواء</label>
                        <input type="text" id="medName" class="form-control" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label fw-bold">الجرعة</label>
                            <input type="text" id="medDose" class="form-control" placeholder="مثلاً: حبة واحدة" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold">الوقت</label>
                            <input type="time" id="medTime" class="form-control" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4">
                    <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">إلغاء</button>
                    <button type="submit" class="btn btn-primary px-4">حفظ الدواء</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
