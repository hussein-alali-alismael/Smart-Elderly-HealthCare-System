<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>تسجيل الدخول - رعاية المسنين</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <main class="card p-4 shadow-lg" style="width: min(420px, 92vw);">
        <h2 class="fw-bold text-center mb-2">رعاية المسنين</h2>
        <p class="text-muted text-center mb-4">تسجيل الدخول إلى لوحة التحكم</p>
        <form id="loginPageForm">
            <label for="loginOpenId" class="form-label fw-bold">البريد الإلكتروني أو معرّف المستخدم</label>
            <input id="loginOpenId" class="form-control mb-3" type="text" placeholder="admin@example.com" required>
            <button class="btn btn-primary w-100" type="submit">تسجيل الدخول</button>
            <div id="authError" class="text-danger text-center mt-3" style="display: none;"></div>
        </form>
        <p class="text-center mt-4 mb-0">ليس لديك حساب؟ <a href="/signup">إنشاء حساب</a></p>
    </main>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
