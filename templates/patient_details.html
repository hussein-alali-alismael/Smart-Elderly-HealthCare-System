<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام رعاية المسنين - تفاصيل المريض</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="wrapper">
    <nav id="sidebar">
        <div class="sidebar-header">
            <h3>رعاية المسنين</h3>
        </div>
        <ul class="list-unstyled components">
            <li class="active"><a href="index.html"><i class="fas fa-users"></i> إدارة المرضى</a></li>
            <li><a href="medications.html"><i class="fas fa-pills"></i> الأدوية</a></li>
            <li><a href="notifications.html"><i class="fas fa-bell"></i> الإشعارات <span class="notif-badge">0</span></a></li>
            <li><a href="live.html"><i class="fas fa-video"></i> المراقبة المباشرة</a></li>
        </ul>
    </nav>

    <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm rounded-4 mb-4 p-3">
            <div class="container-fluid">
                <a href="index.html" class="btn btn-light"><i class="fas fa-arrow-right me-2"></i> العودة</a>
                <h4 class="ms-auto mb-0 fw-bold">ملف المريض</h4>
            </div>
        </nav>

        <div class="row">
            <div class="col-lg-4">
                <div class="card text-center p-4">
                    <img id="detImg" src="" class="rounded-circle mx-auto mb-3 shadow border border-4 border-white" style="width: 150px; height: 150px; object-fit: cover;">
                    <h3 id="detName" class="fw-bold"></h3>
                    <p class="text-muted" id="detAge"></p>
                    <span class="badge bg-success p-2 px-4 rounded-pill" id="detStatus"></span>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card p-4 mb-4">
                    <h5 class="fw-bold mb-3"><i class="fas fa-notes-medical text-primary me-2"></i> السجل الطبي</h5>
                    <hr>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="text-muted d-block">الأمراض المزمنة</label>
                            <strong id="detDiseases"></strong>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="text-muted d-block">فصيلة الدم</label>
                            <strong>O+</strong>
                        </div>
                    </div>
                </div>
                <div class="card p-4">
                    <h5 class="fw-bold mb-3"><i class="fas fa-pills text-primary me-2"></i> الأدوية المجدولة</h5>
                    <div id="detMedsList">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script>$(document).ready(() => initPatientDetail());</script>
</body>
</html>
