<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>إنشاء حساب - رعاية المسنين</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <main class="card p-4 shadow-lg" style="width: min(420px, 92vw);">
        <h2 class="fw-bold text-center mb-2">إنشاء حساب</h2>
        <p class="text-muted text-center mb-4">أنشئ حساب مقدم الرعاية</p>
        <form id="signupPageForm">
            <label for="signupName" class="form-label fw-bold">الاسم الكامل</label>
            <input id="signupName" class="form-control mb-3" type="text" required>
            <label for="signupEmail" class="form-label fw-bold">البريد الإلكتروني</label>
            <input id="signupEmail" class="form-control mb-3" type="email" required>
            <button class="btn btn-primary w-100" type="submit">إنشاء الحساب</button>
            <div id="authError" class="text-danger text-center mt-3" style="display: none;"></div>
        </form>
        <p class="text-center mt-4 mb-0">لديك حساب؟ <a href="/login">تسجيل الدخول</a></p>
        <small class="text-muted text-center mt-3">يستخدم النظام حالياً البريد الإلكتروني كهوية الحساب.</small>
    </main>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
